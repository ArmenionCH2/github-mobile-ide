name: Android optimized release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  android:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and NDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not available"; exit 1; }
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon assets/logo.svg
      - run: npx tauri android init --ci
      - name: Prefer direct Gradle distribution and allow slow downloads
        run: |
          prop="src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties"
          if grep -q '^networkTimeout=' "$prop"; then
            sed -i 's/^networkTimeout=.*/networkTimeout=120000/' "$prop"
          else
            echo 'networkTimeout=120000' >> "$prop"
          fi
          sed -i 's#services.gradle.org/distributions#downloads.gradle.org/distributions#' "$prop"
      - name: Build optimized release APK
        run: npx tauri android build --apk --target aarch64 --ci
      - name: Align, sign and verify release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          build_dir="src-tauri/gen/android/app/build/outputs/apk"
          mapfile -t candidates < <(find "$build_dir" -type f -name '*.apk' | sort)
          (("${#candidates[@]}" > 0)) || { echo "No release APK produced"; exit 1; }
          unsigned=""
          for apk in "${candidates[@]}"; do
            if [[ "$apk" == *release* ]] && [[ "$apk" == *unsigned* ]]; then unsigned="$apk"; break; fi
          done
          if [[ -z "$unsigned" ]]; then
            for apk in "${candidates[@]}"; do
              if [[ "$apk" == *release* ]]; then unsigned="$apk"; break; fi
            done
          fi
          [[ -n "$unsigned" ]] || { printf 'No release APK found; candidates:\n%s\n' "${candidates[*]}"; exit 1; }
          echo "Found release APK at $unsigned"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          aligned="$RUNNER_TEMP/arm64-aligned.apk"
          keystore="$RUNNER_TEMP/android-release-key.jks"
          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            alias="$ANDROID_KEY_ALIAS"
            storepass="$ANDROID_KEYSTORE_PASSWORD"
            keypass="$ANDROID_KEY_PASSWORD"
          elif [[ -z "$ANDROID_KEYSTORE_BASE64" && -z "$ANDROID_KEYSTORE_PASSWORD" && -z "$ANDROID_KEY_ALIAS" && -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::warning::Using a throwaway APK signing key. Later APKs may require uninstalling this version."
            alias="github-mobile-ide"
            storepass="ephemeral-release-build"
            keypass="$storepass"
            keytool -genkeypair -noprompt -keystore "$keystore" -storepass "$storepass" -keypass "$keypass" -alias "$alias" -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=GitHub Mobile IDE local test release"
          else
            echo "::error::Incomplete signing secret configuration. Provide all four signing secrets or none."
            exit 1
          fi
          "$tools/zipalign" -f -p 4 "$unsigned" "$aligned"
          mkdir -p release-apk
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          output="release-apk/GitHub-Mobile-IDE-v${version}-arm64-release.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$alias" --ks-pass "pass:$storepass" --key-pass "pass:$keypass" --out "$output" "$aligned"
          "$tools/apksigner" verify --verbose "$output"
          unzip -tqq "$output"
          sha256sum "$output"
          du -h "$output"
          echo "Verified installable release APK: $output"
      - uses: actions/upload-artifact@v4
        with:
          name: github-mobile-ide-android-arm64-release
          path: release-apk/*.apk
          if-no-files-found: error
          retention-days: 30
