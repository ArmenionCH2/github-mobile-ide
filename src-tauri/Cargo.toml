[package]
name = "github-mobile-ide"
version = "0.1.0"
description = "Android-first GitHub direct editor"
authors = ["GitHub Mobile IDE Contributors"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "github_mobile_ide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri-plugin-opener = "2"
